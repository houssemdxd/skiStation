<div class="dash-head">
  <div>
    <h1>Gestion des pistes</h1>
    <p>{{ catalog.pistes().length }} pistes dans le domaine.</p>
  </div>
  <button class="btn btn-amber btn-sm" type="button" (click)="actions.openAddPiste()">+ Nouvelle piste</button>
</div>
<div class="panel">
  <div class="panel-body">
    <table>
      <thead>
        <tr><th>N°</th><th>Nom</th><th>Difficulté</th><th>Longueur</th><th>Pente</th><th class="actions">Actions</th></tr>
      </thead>
      <tbody>
        @for (p of catalog.pistes(); track p.num) {
          <tr>
            <td>#{{ p.num }}</td>
            <td>{{ p.nom }}</td>
            <td><app-color-badge [color]="p.color" /></td>
            <td>{{ p.km }} km</td>
            <td>{{ p.pente }}%</td>
            <td class="actions">
              <div class="table-actions">
                <button class="btn-row btn-row-danger" type="button" (click)="actions.deletePiste(p.num)">Supprimer</button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="6" class="muted">Aucune piste.</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
